name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TASK_VERSION: 3.45.5
  GOLANGCI_LINT_VERSION: v2.15.0
  PNPM_VERSION: 10.32.1
  NODE_VERSION: 24

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          check-latest: true
          cache-dependency-path: backend/go.mod

      - uses: go-task/setup-task@v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Install complexity and vulnerability tools
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          go install github.com/uudashr/gocognit/cmd/gocognit@v1.3.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Quality gates
        run: task backend:check

      - name: Vulnerability scan
        working-directory: backend
        run: govulncheck ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: go-task/setup-task@v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - run: task frontend:install

      - name: Quality gates
        run: task frontend:check

      - name: Build
        working-directory: frontend
        run: pnpm build

  database:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openboard
          POSTGRES_USER: openboard
          POSTGRES_PASSWORD: openboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openboard -d openboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build migrations image
        run: docker build -t openboard-migrations:ci database

      - name: Validate, apply, roll back and re-apply every changeset
        run: |
          liquibase() {
            docker run --rm --network host openboard-migrations:ci \
              --changelog-file=migrations/changelog/db.changelog-master.yaml \
              --url=jdbc:postgresql://localhost:5432/openboard \
              --username=openboard \
              --password=openboard \
              "$@"
          }
          liquibase validate
          liquibase update-testing-rollback

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@2.78.0 lint docs/api/openapi.yaml

  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, database]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
