# Local development stack. Shared environments apply migrations through CD.
name: openboard

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${OPENBOARD_DB_NAME:-openboard}
      POSTGRES_USER: ${OPENBOARD_DB_USER:-openboard}
      POSTGRES_PASSWORD: ${OPENBOARD_DB_PASSWORD:-openboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    build: ./database
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --changelog-file=migrations/changelog/db.changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${OPENBOARD_DB_NAME:-openboard}
      - --username=${OPENBOARD_DB_USER:-openboard}
      - --password=${OPENBOARD_DB_PASSWORD:-openboard}
      - update

  backend:
    build: ./backend
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      OPENBOARD_HTTP_ADDR: ":8080"
      OPENBOARD_LOG_LEVEL: ${OPENBOARD_LOG_LEVEL:-info}
      OPENBOARD_DATABASE_URL: postgres://${OPENBOARD_DB_USER:-openboard}:${OPENBOARD_DB_PASSWORD:-openboard}@postgres:5432/${OPENBOARD_DB_NAME:-openboard}?sslmode=disable
      # Optional: seed the first Administrator instead of admin/admin.
      OPENBOARD_ADMIN_USERNAME: ${OPENBOARD_ADMIN_USERNAME:-}
      OPENBOARD_ADMIN_PASSWORD: ${OPENBOARD_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      OPENBOARD_API_UPSTREAM: http://backend:8080
    ports:
      - "3000:8080"

volumes:
  postgres-data:
