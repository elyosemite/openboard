openapi: 3.1.0
info:
  title: OpenBoard API
  version: 0.1.0
  description: |
    Authoritative contract of the OpenBoard HTTP API (see api.md).
    Domain resources live under /api/v1. Operational probes live at the root
    because they are not domain resources.

    Authentication uses a server-side session (ADR 0006) carried by the
    `__Host-openboard_session` cookie, set by `POST /api/v1/sessions`.
    Requests with a body must be sent as `application/json`, and cross-origin
    browser requests that change state are rejected with 403.

    While a User has a pending Temporary Password, every authenticated
    endpoint other than `GET /api/v1/users/me`, `PUT /api/v1/users/me/password`
    and `DELETE /api/v1/sessions/current` answers 403 with the
    `password-change-required` problem type.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - sessionCookie: []
tags:
  - name: operations
    description: Liveness and readiness probes.
  - name: sessions
    description: Signing in and out.
  - name: users
    description: The signed-in User.
  - name: organizations
    description: Organizations, the tenants of the Instance (ADR 0003).
paths:
  /healthz:
    get:
      tags: [operations]
      operationId: getLiveness
      summary: Liveness probe
      description: Reports that the process is running. Never checks dependencies.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /readyz:
    get:
      tags: [operations]
      operationId: getReadiness
      summary: Readiness probe
      description: Reports whether every dependency required to serve traffic is reachable.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ready
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: A dependency is not ready. The failing dependency is logged, not exposed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/service-unavailable
                title: Service unavailable
                status: 503
                instance: /readyz
  /api/v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Sign in
      description: |
        Checks a Username and password and starts a session, returned in the
        session cookie. Every credential failure gives the same 401, so the
        response never reveals whether a Username exists. After repeated
        failures the Username is blocked for a few minutes (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "201":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie (HttpOnly, Secure, SameSite=Lax).
              schema:
                type: string
              example: __Host-openboard_session=abc123; Path=/; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax
            Location:
              description: The created session.
              schema:
                type: string
              example: /api/v1/sessions/current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          description: Invalid Username or password.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/invalid-credentials
                title: Invalid username or password
                status: 401
                instance: /api/v1/sessions
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: Too many failed sign-ins for this Username. Try again later.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
              example: 300
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/too-many-attempts
                title: Too many failed sign-in attempts
                status: 429
                instance: /api/v1/sessions
  /api/v1/sessions/current:
    delete:
      tags: [sessions]
      operationId: deleteCurrentSession
      summary: Sign out
      description: |
        Ends the session behind the cookie and clears it. Succeeds even when
        the session is already gone.
      security:
        - sessionCookie: []
        - {}
      responses:
        "204":
          description: Signed out. The session cookie is cleared.
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: Get the signed-in User
      description: Available while a Temporary Password is pending, so clients can ask for a new one.
      responses:
        "200":
          description: The signed-in User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/users/me/password:
    put:
      tags: [users]
      operationId: replaceCurrentUserPassword
      summary: Change the signed-in User's password
      description: |
        Replaces the password, clears a pending Temporary Password and ends
        every other session of the User. The new password must have 12 to 128
        characters and differ from the current password and from the Username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed. The current session stays signed in.
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The current password is wrong or the new one breaks the password rules.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/validation-error
                title: Validation failed
                status: 422
                instance: /api/v1/users/me/password
                errors:
                  - field: new_password
                    code: weak
                    message: use at least 12 characters
  /api/v1/organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      summary: List Organizations
      description: |
        Lists the Organizations the signed-in User can see, ordered by name
        ignoring case: every Organization for an Administrator (ADR 0009),
        otherwise those the User holds an Organization Membership in.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of Organizations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PasswordChangeRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/InvalidPage"
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Create an Organization
      description: |
        Creates an Organization with its Default Workspace, an Open Workspace
        named "Default", and gives its first Organization Owner an
        Organization Membership. The Owner is the creator unless
        `owner_user_id` names another User. Only Administrators can create
        Organizations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created.
          headers:
            Location:
              description: The created Organization.
              schema:
                type: string
              example: /api/v1/organizations/0b5e3c1a-9f2d-4e6b-8a7c-1d2e3f4a5b6c
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The signed-in User is not an Administrator (`forbidden`), has a
            pending Temporary Password (`password-change-required`), or the
            request is cross-origin (`cross-origin-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/forbidden
                title: Not allowed
                status: 403
                instance: /api/v1/organizations
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The name is blank or too long (`name`/`invalid`), or `owner_user_id`
            is not a UUID (`invalid`) or not a User (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/validation-error
                title: Validation failed
                status: 422
                instance: /api/v1/organizations
                errors:
                  - field: owner_user_id
                    code: not_found
                    message: user not found
  /api/v1/organizations/{organization_id}:
    get:
      tags: [organizations]
      operationId: getOrganization
      summary: Get an Organization
      description: |
        Returns an Organization the signed-in User can see. Organizations that
        do not exist and those the User cannot see both answer 404, so the
        response never reveals another tenant's Organizations (ADR 0003).
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PasswordChangeRequired"
        "404":
          description: No such Organization, or the User cannot see it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/not-found
                title: Resource not found
                status: 404
                instance: /api/v1/organizations/0b5e3c1a-9f2d-4e6b-8a7c-1d2e3f4a5b6c
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  parameters:
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-openboard_session
      description: Opaque session token set by `POST /api/v1/sessions`.
  schemas:
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed; must not be blank.
          example: Acme
        owner_user_id:
          type: string
          format: uuid
          description: The User who becomes the first Organization Owner. Defaults to the creator.
    Organization:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Acme
        created_at:
          type: string
          format: date-time
    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: gabriel
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    User:
      type: object
      required: [id, username, name, is_administrator, must_change_password]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
          example: gabriel
        name:
          type: string
          example: Gabriel Souza
        is_administrator:
          type: boolean
          description: Whether the User is the Instance Administrator.
        must_change_password:
          type: boolean
          description: Whether a Temporary Password is pending.
    Page:
      type: object
      description: Pagination fields of every collection response; `items` holds the records.
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total_items:
          type: integer
          example: 42
        total_pages:
          type: integer
          example: 3
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    Problem:
      type: object
      description: RFC 9457 Problem Details. Returned by every error response.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable identifier of the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: Request path where the problem occurred.
        errors:
          type: array
          description: Field-level details of a validation-error problem.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Request field the error refers to.
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable explanation.
  responses:
    PasswordChangeRequired:
      description: The signed-in User must change a pending Temporary Password first.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://openboard.dev/problems/password-change-required
            title: Password change required
            status: 403
    InvalidPage:
      description: "`page` or `page_size` is out of range."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://openboard.dev/problems/validation-error
            title: Validation failed
            status: 422
            errors:
              - field: page_size
                code: invalid
                message: page_size must be a whole number from 1 to 100
    Unauthenticated:
      description: No valid session. Sign in again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://openboard.dev/problems/unauthenticated
            title: Not signed in
            status: 401
            instance: /api/v1/users/me
    MalformedRequest:
      description: The request body is not valid JSON for this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body is not sent as application/json.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CrossOriginRequest:
      description: A cross-origin browser request tried to change state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: The path exists but does not accept this method. See the Allow header.
      headers:
        Allow:
          schema:
            type: string
          example: GET, HEAD
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
