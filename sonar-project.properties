# Local SonarQube only (http://localhost:9000). Never point this at a hosted server.
sonar.projectKey=openboard
sonar.projectName=OpenBoard
sonar.sourceEncoding=UTF-8

sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,frontend/src/test/**
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx

# Same exclusions as the Vitest coverage config: entry point and barrel files.
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/**/index.ts

sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Only frontend/src is analyzed; without this the scanner loads every
# tsconfig in the repository (docs/ included), wasting memory.
sonar.typescript.tsconfigPaths=frontend/tsconfig.app.json
# Node.js heap of the TypeScript analysis, in MB. The default (~2 GB) plus
# SonarQube and the MCP server exhausts the 4 GB Docker VM and gets
# SonarQube OOM-killed.
sonar.javascript.node.maxspace=1024
