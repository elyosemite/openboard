# Single entry point for every OpenBoard migration (see Database.md).
#
# Register each new migration with an explicit `include` (never rely on
# alphabetical folder order), grouped in this dependency order:
#   1. types/ and sequences/
#   2. tables/
#   3. constraints/
#   4. indexes/
#   5. functions/ and procedures/
#   6. triggers/
#   7. views/ and materialized-views/
#   8. seeds/
#   9. permissions/
#
# Example:
#   - include:
#       file: ../tables/20261115103000_create_organizations_table.sql
#       relativeToChangelogFile: true
databaseChangeLog: []
