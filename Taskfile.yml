# Task runner (https://taskfile.dev). Install: go install github.com/go-task/task/v3/cmd/task@latest
version: "3"

vars:
  SONAR_HOST_URL: '{{.SONAR_HOST_URL | default "http://host.docker.internal:9000"}}'

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  check:
    desc: Run every quality gate
    cmds:
      - task: backend:check
      - task: frontend:check

  backend:check:
    desc: All backend gates
    cmds:
      - task: backend:fmt
      - task: backend:vet
      - task: backend:lint
      - task: backend:complexity
      - task: backend:test

  backend:fmt:
    desc: Fail if any Go file is not gofmt-formatted
    dir: backend
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  backend:vet:
    desc: go vet
    dir: backend
    cmds:
      - go vet ./...

  backend:lint:
    desc: golangci-lint
    dir: backend
    cmds:
      - golangci-lint run ./...

  backend:complexity:
    desc: gocyclo <= 10, gocognit <= 15
    dir: backend
    cmds:
      - gocyclo -over 10 .
      - gocognit -over 15 .

  backend:test:
    desc: Tests with coverage profile (backend/coverage.out)
    dir: backend
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile

  frontend:check:
    desc: Prettier, ESLint, tsc and tests with coverage
    dir: frontend
    cmds:
      - pnpm format:check
      - pnpm lint
      - pnpm typecheck
      - pnpm test:coverage

  sonar:
    desc: Analyze on the local SonarQube (needs OPENBOARD_SONAR_TOKEN)
    preconditions:
      - sh: test -n "$OPENBOARD_SONAR_TOKEN"
        msg: OPENBOARD_SONAR_TOKEN is not set
    cmds:
      - task: backend:test
      - pnpm --dir frontend test:coverage
      - >-
        docker run --rm
        -e SONAR_HOST_URL={{.SONAR_HOST_URL}}
        -e SONAR_TOKEN=$OPENBOARD_SONAR_TOKEN
        -v "{{.ROOT_DIR}}:/usr/src"
        sonarsource/sonar-scanner-cli

  up:
    desc: Start the local stack (postgres, liquibase, backend, frontend)
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop the local stack and drop its volumes
    cmds:
      - docker compose down -v
